services:
  postgres:
    image: postgres:17-alpine
    container_name: floq-postgres
    environment:
      POSTGRES_USER: floq
      POSTGRES_PASSWORD: floq_dev
      POSTGRES_DB: floq
    ports:
      - "5433:5432"
    volumes:
      - floq-pgdata:/var/lib/postgresql/data

volumes:
  floq-pgdata:
